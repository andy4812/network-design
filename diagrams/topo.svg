y blocked STP uplinks.</tspan></text><rect x="20" y="954" width="1460" height="26" rx="0" fill="none" stroke="none" stroke-width="1.5"/><text x="750.0" fill="#706B63" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="middle" dominant-baseline="central"><tspan x="750.0" y="967.0">Access switches are representative groups. Site prefixes are IPv4 allocations.</tspan></text></svg>